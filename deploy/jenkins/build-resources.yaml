apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lecpunch-image-cache
  namespace: kubesphere-devops-worker
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lecpunch-build-registries
  namespace: kubesphere-devops-worker
data:
  registries.conf: |
    [[registry]]
    location = "docker.io"
    [[registry.mirror]]
    location = "m.daocloud.io/docker.io"
